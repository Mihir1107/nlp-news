<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Choose the edition before the page paints (no flash of the wrong theme):
      // the reader's last choice, otherwise the operating system's light/dark setting.
      try {
        var t = localStorage.getItem('newsmind-theme')
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NewsMind: six language models read the news and mark up the copy like an editor." />
    <title>NewsMind</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23EEF0EA'/><text x='16' y='24' font-size='24' text-anchor='middle' font-family='Didot, Bodoni 72, Georgia, serif' fill='%231B1C19'>N</text><rect x='6' y='27' width='20' height='2' fill='%232438A6'/></svg>" />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
